<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140a26"/>
      <stop offset="0.55" stop-color="#3a1660"/>
      <stop offset="1" stop-color="#0d0518"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#fdf3ff"/>
      <stop offset="0.55" stop-color="#e5c2ff"/>
      <stop offset="1" stop-color="#a86ce8"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c77dff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#c77dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9ad5" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff9ad5" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#9d6bff" stop-opacity="0"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.92  0 0 0 0 0.8  0 0 0 0 1  0 0 0 0.055 0"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="430" cy="300" r="330" fill="url(#halo)"/>
  <circle cx="430" cy="300" r="150" fill="url(#moon)"/>
  <g fill="#8f5fd0" opacity="0.35">
    <circle cx="380" cy="255" r="26"/><circle cx="470" cy="330" r="18"/><circle cx="415" cy="365" r="11"/>
    <circle cx="487" cy="262" r="9"/>
  </g>
  <g fill="none" stroke="url(#ribbon)" stroke-linecap="round">
    <path d="M40 560 C 240 500, 420 640, 760 545" stroke-width="5"/>
    <path d="M20 615 C 260 560, 470 690, 780 610" stroke-width="3.5" opacity="0.75"/>
    <path d="M60 665 C 300 620, 460 730, 740 668" stroke-width="2.5" opacity="0.5"/>
  </g>
  <g fill="#ffe8ff" opacity="0.75">
    <circle cx="140" cy="130" r="2"/><circle cx="240" cy="90" r="1.4"/><circle cx="660" cy="140" r="2.2"/>
    <circle cx="720" cy="330" r="1.5"/><circle cx="90" cy="330" r="1.6"/><circle cx="560" cy="70" r="1.3"/>
    <circle cx="640" cy="440" r="1.6"/>
  </g>
  <rect width="800" height="800" filter="url(#grain)"/>
</svg>
